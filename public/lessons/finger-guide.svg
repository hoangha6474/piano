<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540"><rect width="960" height="540" rx="22" fill="#f3f5ec"/><text x="65" y="65" fill="#8a9777" font-family="Arial" font-size="13" letter-spacing="4">PIANO LEARNING · MINH HỌA</text><text x="65" y="117" fill="#38482d" font-family="Arial" font-size="30">Năm ngón tay, một khởi đầu</text><text x="65" y="158" fill="#82926e" font-family="Arial" font-size="17">Số ngón giống nhau ở cả hai tay.</text><rect x="290" y="318" width="310" height="115" rx="40" fill="#e2e9d4" stroke="#bbc9a4" stroke-width="2"/><rect x="292" y="248" width="52" height="95" rx="25" fill="#829665" stroke="#b6c69e" stroke-width="2"/><text x="318" y="288" text-anchor="middle" fill="#fff" font-family="Arial" font-size="22">1</text><rect x="352" y="205" width="52" height="150" rx="25" fill="#dce6cc" stroke="#b6c69e" stroke-width="2"/><text x="378" y="245" text-anchor="middle" fill="#6e8353" font-family="Arial" font-size="22">2</text><rect x="412" y="180" width="52" height="175" rx="25" fill="#dce6cc" stroke="#b6c69e" stroke-width="2"/><text x="438" y="220" text-anchor="middle" fill="#6e8353" font-family="Arial" font-size="22">3</text><rect x="472" y="210" width="52" height="145" rx="25" fill="#dce6cc" stroke="#b6c69e" stroke-width="2"/><text x="498" y="250" text-anchor="middle" fill="#6e8353" font-family="Arial" font-size="22">4</text><rect x="532" y="250" width="52" height="105" rx="25" fill="#dce6cc" stroke="#b6c69e" stroke-width="2"/><text x="558" y="290" text-anchor="middle" fill="#6e8353" font-family="Arial" font-size="22">5</text><text x="690" y="270" text-anchor="middle" fill="#738755" font-family="Arial" font-size="72">1</text><text x="690" y="312" text-anchor="middle" fill="#768665" font-family="Arial" font-size="21">Ngón cái</text><text x="65" y="485" fill="#7f8f6b" font-family="Arial" font-size="16">Thả lỏng cổ tay. Giữ khớp ngón tự nhiên, chuyển động nhẹ nhàng.</text><text x="65" y="515" fill="#a3ad94" font-family="Arial" font-size="11">Sơ đồ minh họa số ngón; không phải đo ngón tay thực tế qua MIDI.</text></svg>